name: TestFlight Deploy

on:
  push:
    branches: [main2]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  EAS_CLI_VERSION: '21.7.0'

jobs:
  quick-checks:
    name: Fast preflight (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Jest
        run: npm test -- --ci --reporters=default

  build-and-submit:
    name: EAS build + submit to TestFlight
    needs: quick-checks
    runs-on: ubuntu-latest
    environment: testflight
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@${{ env.EAS_CLI_VERSION }}

      - name: Verify Expo auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: EAS build (iOS, testflight profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile testflight \
            --non-interactive \
            --wait

      - name: EAS submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas submit \
            --platform ios \
            --latest \
            --profile testflight \
            --non-interactive
